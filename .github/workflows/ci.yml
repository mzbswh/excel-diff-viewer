name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate VSIX
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check extension
        run: npm run check

      - name: Build extension
        run: npm run build

      - name: Package and inspect VSIX
        id: package
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          vsix="excel-diff-viewer-${version}.vsix"
          npm run package -- --out "${vsix}"
          npm run package:list
          unzip -t "${vsix}"
          echo "vsix=${vsix}" >> "${GITHUB_OUTPUT}"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: excel-diff-viewer-${{ github.sha }}
          path: ${{ steps.package.outputs.vsix }}
          if-no-files-found: error
          retention-days: 14

name: CI

on:
  pull_request:
    branches:
      - main
      - v1.0
  push:
    branches:
      - main
      - v1.0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate VSIX
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check extension
        run: npm run check

      - name: Build extension
        run: npm run build

      - name: Package and inspect VSIX
        id: package
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          vsix="excel-diff-viewer-${version}.vsix"
          npm run package -- --out "${vsix}"
          npm run package:list
          unzip -t "${vsix}"
          echo "vsix=${vsix}" >> "${GITHUB_OUTPUT}"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: excel-diff-viewer-${{ github.sha }}
          path: ${{ steps.package.outputs.vsix }}
          if-no-files-found: error
          retention-days: 14
